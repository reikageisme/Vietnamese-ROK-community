services:
  web:
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      mailpit:
        condition: service_started
    # The named volume hides image-layer node_modules. Refresh only when the
    # lockfile changes, then regenerate the Prisma client on every startup.
    command:
      - sh
      - -c
      - >-
        lock_hash=$$(sha256sum package-lock.json | cut -d ' ' -f1);
        if [ "$$(cat node_modules/.rokfaq-lock-hash 2>/dev/null)" != "$$lock_hash" ]; then
          npm ci && echo "$$lock_hash" > node_modules/.rokfaq-lock-hash;
        fi;
        npx prisma generate --schema prisma/schema &&
        npm run dev -- --hostname 0.0.0.0
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next

  ocr-worker:
    volumes:
      - ./workers/ocr:/app

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next_cache:
