[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rokviet-device-lab"
version = "0.1.0"
description = "Safe multi-device ADB control lab for RokViet Hub"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.scripts]
rok-device = "rok_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rok_lab*"]
