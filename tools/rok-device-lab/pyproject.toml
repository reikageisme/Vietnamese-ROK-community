[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rokviet-device-lab"
version = "0.2.0"
description = "Multi-phone ADB kingdom scanner for RokViet Hub"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=10.4,<13",
]

[project.scripts]
rok-device = "rok_lab.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.16,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rok_lab*"]
