# GIU NGUYEN 'rokviet-hub'. Day la ten project cua Compose, va Docker dung no
# lam tien to cho TEN VOLUME (rokviet-hub_postgres_data, ...). Doi ten nay =
# Docker tao volume moi RONG: Postgres, MinIO, Redis deu mat sach du lieu.
# Thuong hieu da doi thanh ROK FAQ; cai nay la khoa ky thuat, khong phai ten.
name: rokviet-hub

x-common-environment: &common-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://rokviet:rokviet_dev_password@postgres:5432/rokviet?schema=public}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rokfaq}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rokviet_dev_minio_password}
  # GIU NGUYEN: bucket nay dang chua anh bang chung cua cac lan quet.
  # Doi ten = tro vao mot bucket rong, anh cu khong con duong nao lay lai.
  S3_BUCKET: ${S3_BUCKET:-rokviet-uploads}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:-dev-collector-token-change-me-now}
  DEVICE_AGENT_TOKEN: ${DEVICE_AGENT_TOKEN:-dev-device-agent-token-change-me-32}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: ${NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS:-false}
    environment:
      <<: *common-environment
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-ROK FAQ <no-reply@rokfaq.local>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      # GIU NGUYEN: day la ten database va role CO THAT trong volume hien tai.
      # Doi mac dinh o day khong doi ten gi trong Postgres — chi lam khong ket noi duoc.
      POSTGRES_DB: ${POSTGRES_DB:-rokviet}
      POSTGRES_USER: ${POSTGRES_USER:-rokviet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rokviet_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rokfaq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rokviet_dev_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rokfaq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rokviet_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-rokviet-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - app
    restart: "no"

  ocr-worker:
    build:
      context: ./workers/ocr
      dockerfile: Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OCR_QUEUE_KEY: ${OCR_QUEUE_KEY:-rokfaq:ocr:jobs}
      OCR_RESULT_TTL_SECONDS: ${OCR_RESULT_TTL_SECONDS:-604800}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-15728640}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-25000000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rokfaq}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rokviet_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-rokviet-uploads}
      TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-eng+vie}
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    # Chi chay khi bat --profile production. Day la thu lang nghe cong 80/443
    # va them cac header bao mat; thieu no thi phai vao web bang cong 3030.
    profiles: ["production"]
    environment:
      # Chua co ten mien tro toi day thi dat DOMAIN=:80 — Caddy phuc vu HTTP
      # tren cong 80 cho moi hostname va KHONG di xin chung chi.
      # Co ten mien roi thi dat DOMAIN=rokfaq.com, Caddy tu lay chung chi
      # Let's Encrypt — nhung chi duoc khi cong 80 va 443 thong tu Internet.
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
