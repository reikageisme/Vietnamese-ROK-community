services:
  migrate:
    image: ${WEB_MIGRATION_IMAGE:-rokviet-hub-migration:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-false}
      DEMO_MEMBER_PASSWORD: ${DEMO_MEMBER_PASSWORD:-RokVietDemo!2026}
      DEMO_MODERATOR_PASSWORD: ${DEMO_MODERATOR_PASSWORD:-RokVietMod!2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  web:
    image: ${WEB_IMAGE:-rokviet-hub-web:latest}
    build:
      target: runner
    environment:
      APP_SURFACE: public
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set for production}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?COLLECTOR_API_TOKEN must be set for production}
      DEVICE_AGENT_TOKEN: ""
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set for production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set for production}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set for production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set for production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set for production}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set for production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Bind to localhost by default so an existing host reverse proxy can route
    # a domain/subdomain to RokViet Hub without exposing the app server directly.
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3030}:3000"
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
    restart: always

  ops-web:
    image: ${WEB_IMAGE:-rokviet-hub-web:latest}
    environment:
      APP_SURFACE: ops
      NODE_ENV: production
      APP_URL: ${OPS_APP_URL:-http://localhost:3031}
      NEXTAUTH_URL: ${OPS_APP_URL:-http://localhost:3031}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set for production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?COLLECTOR_API_TOKEN must be set for production}
      DEVICE_AGENT_TOKEN: ${DEVICE_AGENT_TOKEN:?DEVICE_AGENT_TOKEN must be set for production}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set for production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set for production}
      S3_BUCKET: ${S3_BUCKET:-rokviet-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set for production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set for production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set for production}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set for production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${OPS_BIND_ADDRESS:-127.0.0.1}:${OPS_PORT:-3031}:3000"
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ops/fleet').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
    ports: !reset []
    restart: always

  ocr-worker:
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set for production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set for production}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  caddy:
    restart: always
