services:
  migrate:
    image: ${WEB_MIGRATION_IMAGE:-rokviet-hub-migration:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  web:
    image: ${WEB_IMAGE:-rokviet-hub-web:latest}
    build:
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set for production}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set for production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set for production}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set for production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set for production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set for production}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set for production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Bind to localhost by default so an existing host reverse proxy can route
    # a domain/subdomain to RokViet Hub without exposing the app server directly.
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3030}:3000"
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
    restart: always

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
    ports: !reset []
    restart: always

  ocr-worker:
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set for production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set for production}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  caddy:
    restart: always
